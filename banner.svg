<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <clipPath id="avatarClip">
      <circle cx="980" cy="160" r="75"/>
    </clipPath>
  </defs>

  <!-- Fondo -->
  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>

  <!-- Decoración -->
  <circle cx="1120" cy="40" r="120" fill="#1E40AF" opacity="0.08"/>
  <circle cx="80" cy="300" r="90" fill="#06B6D4" opacity="0.05"/>

  <!-- Nombre -->
  <text
    x="70"
    y="110"
    fill="#FFFFFF"
    font-size="52"
    font-family="Inter, Arial"
    font-weight="700">
    Raúl Quintana
  </text>

  <!-- Subtítulo -->
  <text
    x="70"
    y="155"
    fill="#60A5FA"
    font-size="28"
    font-family="Inter, Arial">
    Full Stack Developer
  </text>

  <text
    x="70"
    y="190"
    fill="#9CA3AF"
    font-size="24"
    font-family="Inter, Arial">
    Junior Software Engineer
  </text>

  <text
    x="70"
    y="225"
    fill="#9CA3AF"
    font-size="24"
    font-family="Inter, Arial">
    Data Analytics • Artificial Intelligence
  </text>

  <!-- Línea decorativa -->
  <rect
    x="70"
    y="245"
    width="260"
    height="4"
    rx="2"
    fill="#3B82F6"/>

  <!-- Aro del avatar -->
  <circle
    cx="980"
    cy="160"
    r="82"
    fill="none"
    stroke="url(#ring)"
    stroke-width="5"/>

  <!-- Avatar -->
  <!-- Reemplaza href por ./assets/avatar_r.jpeg cuando lo subas al repo -->
  <image
    href="https://firebasestorage.googleapis.com/v0/b/relatia-22b88.firebasestorage.app/o/avatar_r.jpeg?alt=media&token=d8921dee-ea9b-48af-a1e9-29f731dc3712"
    x="905"
    y="85"
    width="150"
    height="150"
    clip-path="url(#avatarClip)"
    preserveAspectRatio="xMidYMid slice"/>

</svg>
